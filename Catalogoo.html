title>Libro de Existencias</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Public+Sans:wght@400;500;600&display=swap">
<style>
/* Concepto: libro contable de bodega. Pestañas por categoría, cifras en monoespaciada,
   un solo acento verde azulado; ámbar y rojo se reservan para alertas de stock. */
:root{
  --bg:#F1F4F3; --surface:#FFFFFF; --surface-2:#E7EDEB; --line:#D3DCD9;
  --fg:#14211D; --muted:#566762;
  --accent:#0B6B66; --accent-fg:#FFFFFF; --accent-soft:#D5EAE7;
  --good:#17784A; --good-soft:#D3EBDD;
  --warn:#8F5600; --warn-soft:#F7E6C4;
  --bad:#B3261E; --bad-soft:#F6D9D6;
  --scrim:rgba(10,20,17,.5);
  --f-display:"Familjen Grotesk","Segoe UI",system-ui,sans-serif;
  --f-body:"Public Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1412; --surface:#141F1C; --surface-2:#1C2B28; --line:#2A3C38;
  --fg:#E5EEEB; --muted:#93A8A2;
  --accent:#4FC3BA; --accent-fg:#06201E; --accent-soft:#17403D;
  --good:#5CD39A; --good-soft:#163A29;
  --warn:#EBB65E; --warn-soft:#3F2F10;
  --bad:#FF8F86; --bad-soft:#47201D;
  --scrim:rgba(0,0,0,.65); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0D1412; --surface:#141F1C; --surface-2:#1C2B28; --line:#2A3C38;
  --fg:#E5EEEB; --muted:#93A8A2;
  --accent:#4FC3BA; --accent-fg:#06201E; --accent-soft:#17403D;
  --good:#5CD39A; --good-soft:#163A29;
  --warn:#EBB65E; --warn-soft:#3F2F10;
  --bad:#FF8F86; --bad-soft:#47201D;
  --scrim:rgba(0,0,0,.65); color-scheme:dark;}
 
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:14px/1.5 var(--f-body);
  padding-block:20px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1120px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
 
/* Cabecera */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 20px;padding-bottom:14px;border-bottom:2px solid var(--fg)}
.brand{font:700 24px/1 var(--f-display);letter-spacing:-.02em}
.brand small{display:block;font:400 12px/1.4 var(--f-body);color:var(--muted);letter-spacing:0;margin-top:4px}
.tabs{display:flex;flex-wrap:wrap;gap:4px}
.tab{border:0;background:transparent;padding:8px 14px;border-radius:6px;cursor:pointer;font-weight:600;color:var(--muted)}
.tab:hover{background:var(--surface-2)}
.tab[aria-selected="true"]{background:var(--fg);color:var(--bg)}
.notice{margin:12px 0 0;padding:8px 12px;background:var(--warn-soft);color:var(--warn);border-radius:6px;font-size:13px}
 
/* Botones */
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:6px;cursor:pointer;font-weight:600;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--fg)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.danger[data-armed]{background:var(--bad);color:var(--surface)}
.btn.sm{padding:5px 10px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
 
/* Secciones */
.sec{margin-top:28px}
.sec-h{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 16px;margin-bottom:10px}
.sec-h h2{font-size:18px}
.sec-h p{margin:0;color:var(--muted);font-size:13px}
.grid-2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:28px 32px}
.grid-2>*{min-width:0}
 
/* Indicadores */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));margin-top:20px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.kpi{padding:14px 16px;border-left:1px solid var(--line);min-width:0}
.kpi:first-child{border-left:0;padding-left:0}
.kpi .l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.kpi .v{font:600 clamp(18px,2.3vw,24px)/1.25 var(--f-mono);font-variant-numeric:tabular-nums;margin-top:4px;overflow-wrap:anywhere}
.kpi .s{font-size:12px;color:var(--muted)}
.kpi.alert .v{color:var(--bad)}
 
/* Gráfico */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
#chart{width:100%;min-height:60px}
#chart svg{display:block}
.ax{fill:var(--muted);font:11px var(--f-mono)}
.gridl{stroke:var(--line);stroke-width:1}
.bar{fill:var(--accent);opacity:.55}
.bar.last{opacity:1}
.bar-lbl{fill:var(--fg);font:600 11px var(--f-mono)}
.empty-inline{margin:0;padding:28px 0;color:var(--muted)}
 
/* Listas del panel */
.rank{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.rank li{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:baseline}
.rank .nm{font-weight:600;overflow-wrap:anywhere}
.rank .meta{font:12px var(--f-mono);color:var(--muted);text-align:right}
.meter{grid-column:1/-1;height:4px;background:var(--surface-2);border-radius:2px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent)}
.plain{list-style:none;margin:0;padding:0}
.plain li{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 12px;padding:9px 0;border-bottom:1px solid var(--line)}
.plain li:last-child{border-bottom:0}
.plain .nm{font-weight:600;overflow-wrap:anywhere}
.plain .meta{font:12px var(--f-mono);color:var(--muted)}
 
/* Barra de herramientas y categorías */
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:18px}
.tools .grow{flex:1 1 240px;min-width:0}
.inp,.sel{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:8px 10px;min-width:0}
.tools .sel{width:auto;max-width:100%}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.tools .push{margin-left:auto;display:flex;flex-wrap:wrap;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;font-size:13px;cursor:pointer;white-space:nowrap;font-weight:500}
.chip:hover{border-color:var(--fg)}
.chip .n{font:11px var(--f-mono);opacity:.65;margin-left:4px}
.chip.zero{opacity:.55}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);opacity:1}
@media (max-width:720px){.chips{flex-wrap:nowrap;overflow-x:auto;padding-bottom:6px}}
 
/* Control de unidades */
.step{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.sbtn{width:32px;height:34px;border:0;background:var(--surface-2);cursor:pointer;font-size:18px;line-height:1;font-weight:600}
.sbtn:hover:not(:disabled){background:var(--accent-soft)}
.sbtn:disabled{opacity:.4;cursor:not-allowed}
.sin{width:54px;height:34px;border:0;text-align:center;padding:0;background:transparent;font:600 15px var(--f-mono);-moz-appearance:textfield;appearance:textfield}
.sin::-webkit-inner-spin-button,.sin::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
@media (pointer:coarse){.sbtn{width:42px;height:42px}.sin{height:42px}}
 
/* Vista de tarjetas */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:14px;margin-top:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.cphoto{aspect-ratio:4/3;max-width:100%;background:var(--surface-2);position:relative;display:grid;place-items:center;font:700 34px var(--f-display);color:var(--muted);overflow:hidden}
.cphoto img{width:100%;height:100%;object-fit:cover;display:block}
.cphoto .pill{position:absolute;top:8px;left:8px;margin:0}
.cbody{padding:12px;display:grid;gap:8px;flex:1;align-content:start;min-width:0}
.cbody h3{font-size:15px;line-height:1.3;overflow-wrap:anywhere}
.cprices{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cprices .k{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.cstock{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.cnote{font-size:12px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.cact{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
 
/* Vista de tabla */
.head,.row{display:grid;grid-template-columns:52px minmax(0,1.7fr) 138px 128px 128px 124px 152px;gap:12px;align-items:center}
.head{padding:8px 12px;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);border-bottom:2px solid var(--fg);margin-top:14px}
.row{padding:12px;background:var(--surface);border-bottom:1px solid var(--line)}
.row:hover{background:color-mix(in srgb,var(--surface) 92%,var(--accent))}
.row>*{min-width:0}
.foto{width:52px;height:52px;border-radius:6px;background:var(--surface-2);overflow:hidden;display:grid;place-items:center;font:700 16px var(--f-display);color:var(--muted)}
.foto img{width:100%;height:100%;object-fit:cover;display:block}
.nm{font-weight:600;overflow-wrap:anywhere}
.sub{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.tag{font-size:10px;text-transform:uppercase;letter-spacing:.06em;background:var(--surface-2);color:var(--muted);padding:1px 6px;border-radius:3px;vertical-align:middle;font-weight:600}
.big{font:600 22px/1.1 var(--f-mono);display:block}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:1px 8px;border-radius:99px;margin-top:2px}
.pill.ok{background:var(--good-soft);color:var(--good)}
.pill.bajo{background:var(--warn-soft);color:var(--warn)}
.pill.agotado{background:var(--bad-soft);color:var(--bad)}
.vars{display:block;font:11px var(--f-mono);color:var(--muted);margin-top:2px;overflow-wrap:anywhere}
.price{font:500 15px var(--f-mono);font-variant-numeric:tabular-nums}
.old{text-decoration:line-through;color:var(--muted);font-size:12px;display:block}
.deal{font-size:11px;color:var(--accent);font-weight:600;display:block}
.trend{display:inline-block;font:500 11px var(--f-mono);margin-top:2px;padding:0 5px;border-radius:3px}
.trend.good{background:var(--good-soft);color:var(--good)}
.trend.bad{background:var(--bad-soft);color:var(--bad)}
.c-act{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
.c-stock .pill{display:table;margin-top:4px}
.empty{padding:44px 16px;text-align:center;background:var(--surface);border:1px dashed var(--line);border-radius:8px;margin-top:20px}
.empty h2{font-size:20px;margin-bottom:6px}
.empty p{margin:0 auto 16px;max-width:46ch;color:var(--muted)}
.empty .btns{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
@media (max-width:860px){
  .head{display:none}
  .row{grid-template-columns:52px minmax(0,1fr) auto;row-gap:10px}
  .row>[data-label]{grid-column:1/-1;display:flex;justify-content:space-between;align-items:baseline;gap:12px;border-top:1px dashed var(--line);padding-top:8px}
  .row>.c-stock{grid-column:3;grid-row:1;border:0;padding:0;display:block}
  .row>.c-stock .pill{margin-left:auto}
  .row>[data-label]::before{content:attr(data-label);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
  .row .pr{text-align:right}
  .c-act{grid-column:1/-1;justify-content:flex-start}
}
 
/* Movimientos y proveedores */
.log{background:var(--surface);border-top:2px solid var(--fg)}
.log .r{display:grid;grid-template-columns:132px 92px minmax(0,1fr) 90px minmax(0,1.2fr) 100px;gap:10px;align-items:baseline;padding:9px 12px;border-bottom:1px solid var(--line)}
.log .r>*{min-width:0;overflow-wrap:anywhere}
.log .q{font:500 13px var(--f-mono);text-align:right}
.log .q.pos{color:var(--good)}
.log .q.neg{color:var(--bad)}
.log .w{font-size:12px;color:var(--muted)}
@media (max-width:760px){
  .log .r{grid-template-columns:1fr auto;row-gap:2px}
  .log .r .when{grid-column:1/-1;font-size:12px;color:var(--muted)}
  .log .r .who{grid-column:1/-1}
}
.provs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:12px}
.prov{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;display:grid;gap:6px;align-content:start}
.prov h3{font-size:16px;overflow-wrap:anywhere}
.prov .k{font-size:12px;color:var(--muted)}
.prov .btns{display:flex;gap:6px;margin-top:6px}
 
/* Ventanas */
#modal[hidden]{display:none}
.scrim{position:fixed;inset:0;background:var(--scrim);display:grid;place-items:center;overflow-y:auto;
  padding-top:max(16px,env(safe-area-inset-top,0px));padding-bottom:max(16px,env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));z-index:20}
.sheet{background:var(--surface);width:100%;max-width:640px;border-radius:10px;padding:20px;border:1px solid var(--line);align-self:start;margin:auto 0}
.sheet h2{font-size:20px;margin-bottom:14px}
.sheet h3{font-size:14px;margin:20px 0 8px}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fgrid .full{grid-column:1/-1}
.fld{display:grid;gap:4px;font-size:12px;color:var(--muted);font-weight:600}
.fld .inp,.fld .sel{font-weight:400;color:var(--fg);font-size:14px}
.fld small{font-weight:400}
textarea.inp{resize:vertical;min-height:70px;font-family:var(--f-mono);font-size:13px}
textarea.inp.txt{font-family:var(--f-body);font-size:14px;min-height:60px}
.fotobox{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.fotobox .foto{width:76px;height:76px}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px;justify-content:flex-end}
.acts .left{margin-right:auto}
.total{font:600 18px var(--f-mono);text-align:right;margin-top:12px}
.radios{display:flex;flex-wrap:wrap;gap:8px}
.radios label{display:flex;gap:6px;align-items:center;border:1px solid var(--line);padding:7px 10px;border-radius:6px;cursor:pointer;font-weight:400;color:var(--fg);font-size:13px}
.hist{width:100%;border-collapse:collapse;font:12px var(--f-mono)}
.hist th{text-align:left;color:var(--muted);font-weight:500;padding:4px 6px 4px 0;border-bottom:1px solid var(--line)}
.hist td{padding:4px 6px 4px 0;border-bottom:1px solid var(--line)}
.hist-wrap{overflow-x:auto}
.pv{max-height:150px;overflow:auto;border:1px solid var(--line);border-radius:6px;font:12px var(--f-mono)}
.pv div{padding:4px 8px;border-bottom:1px solid var(--line);overflow-wrap:anywhere}
 
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:max(16px,env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:6px;font-size:13px;z-index:30;max-width:calc(100vw - 32px)}
#toast[hidden]{display:none}
.loading{padding:60px 0;text-align:center;color:var(--muted)}
@media (max-width:520px){.fgrid{grid-template-columns:1fr}.sheet{padding:16px}}
@media (prefers-reduced-motion:no-preference){.row,.btn,.tab,.chip{transition:background .12s,border-color .12s}}
</style>
 
<div class="wrap">
  <header class="top">
    <div class="brand">Libro de existencias<small id="modo">Panel de control e inventario del negocio</small></div>
    <nav class="tabs" aria-label="Secciones">
      <button class="tab" data-act="tab" data-tab="panel">Panel</button>
      <button class="tab" data-act="tab" data-tab="inventario">Inventario</button>
      <button class="tab" data-act="tab" data-tab="movimientos">Movimientos</button>
      <button class="tab" data-act="tab" data-tab="proveedores">Proveedores</button>
    </nav>
  </header>
  <div id="aviso"></div>
  <main id="view"><div class="loading">Cargando tu inventario…</div></main>
</div>
<div id="modal" hidden></div>
<div id="toast" role="status" aria-live="polite" hidden></div>
<input type="file" id="imp" accept=".csv,text/csv" hidden>
 
<script>
(function(){
'use strict';
var $=function(s,r){return (r||document).querySelector(s)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var money=function(n){return 'L '+(Number(n)||0).toLocaleString('es-HN',{minimumFractionDigits:2,maximumFractionDigits:2})};
var num=function(n){return (Number(n)||0).toLocaleString('es-HN')};
var pnum=function(v){return Math.max(0,parseFloat(String(v==null?'':v).replace(',','.'))||0)};
var clone=function(o){return JSON.parse(JSON.stringify(o))};
var uid=function(){return Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4)};
var DAY=864e5;
var TIPOS={entrada:'Entrada',venta:'Venta',ajuste:'Ajuste',precio:'Precio',alta:'Alta',baja:'Baja'};
var CATEGORIAS=['Desodorante para hombre','Desodorante para mujer','Maquillaje','Crema para el pelo','Shampoo','Crema para el cuerpo','Crema para la cara','Chinola','Glasses / Lentes','Bolsa de regalo','Gelatina Hombre','Tazas','Platos','Mochilas','Mochilas de Hombre','Cartera','Carteras de hombre'];
 
var state={productos:[],proveedores:[],movimientos:[],loaded:false,mode:'cargando',tab:'panel',periodo:'dia',vista:'grid',cfg:{minimo:3},
  f:{q:'',cat:'',prov:'',bajo:false},mf:'',names:{}};
var db=null,userNS=null,myId=null,namesKey='',modalFoto='',importPlan=null,toastT=null,pend={};
try{var sv=localStorage.getItem('libro-vista');if(sv==='grid'||sv==='tabla')state.vista=sv}catch(e){}
 
/* ---------- Datos ---------- */
function normProd(id,d){
  var p=Object.assign({},d);p.id=id;
  p.nombre=p.nombre||'Sin nombre';p.categoria=p.categoria||'';p.unidades=Number(p.unidades)||0;
  p.minimo=(p.minimo===undefined||p.minimo===null||p.minimo==='')?null:Number(p.minimo);
  p.costo=Number(p.costo)||0;p.detalle=Number(p.detalle)||0;p.mayorista=Number(p.mayorista)||0;p.nota=p.nota||'';
  p.variaciones=Array.isArray(p.variaciones)?p.variaciones:[];p.historial=Array.isArray(p.historial)?p.historial:[];
  if(pend[id]&&!p.variaciones.length)p.unidades=pend[id].val;
  return p;
}
var LS='libro-existencias-local';
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify({productos:state.productos,proveedores:state.proveedores,movimientos:state.movimientos,cfg:state.cfg}))}catch(e){toast('No se pudo guardar en este navegador (espacio lleno).')}}
function loadLocal(){
  try{var s=JSON.parse(localStorage.getItem(LS)||'null');if(s){state.productos=(s.productos||[]).map(function(p){return normProd(p.id,p)});state.proveedores=s.proveedores||[];state.movimientos=s.movimientos||[];if(s.cfg&&s.cfg.minimo>=0)state.cfg=s.cfg}}catch(e){}
  state.loaded=true;render();
}
var S={
  put:function(col,id,data){
    if(db)return db.doc(col+'/'+id).set(data);
    var item=Object.assign({},clone(data),{id:id});
    if(col==='productos')item=normProd(id,item);
    var arr=state[col],i=arr.findIndex(function(x){return x.id===id});
    if(i>=0)arr[i]=item;else arr.push(item);
    if(col==='movimientos')arr.sort(function(a,b){return b.t-a.t});
    saveLocal();render();return Promise.resolve();
  },
  patch:function(col,id,fields){
    if(db)return db.doc(col+'/'+id).update(fields);

function subscribe(){
  var onErr=function(e){toast('No se pudieron leer los datos'+(e&&e.code?' ('+e.code+')':'')+'.')};

  db.collection('proveedores').onSnapshot(function(s){state.proveedores=s.docs.map(function(d){return Object.assign({id:d.id},d.data())});render()},onErr);
  db.collection('movimientos').orderBy('t','desc').limit(500).onSnapshot(function(s){
    state.movimientos=s.docs.map(function(d){return Object.assign({id:d.id},d.data())});resolveNames();render();
  },onErr);

/* ---------- Cálculos ---------- */
function ofertaActiva(p){return !!(p.oferta&&p.oferta.precio>0&&(!p.oferta.hasta||Date.parse(p.oferta.hasta+'T23:59:59')>=Date.now()))}
function precioDetalle(p){return ofertaActiva(p)?p.oferta.precio:p.detalle}
function limite(p){return p.minimo==null?state.cfg.minimo:p.minimo}
function estado(p){return p.unidades<=0?'agotado':(p.unidades<limite(p)?'bajo':'ok')}
function margen(precio,costo){return precio>0&&costo>0?(precio-costo)/precio*100:null}
function provName(id){var p=state.proveedores.find(function(x){return x.id===id});return p?p.nombre:''}
function trend(p,campo){
  var h=p.historial||[];if(h.length<2)return null;
  var cur=h[h.length-1][campo];
  for(var i=h.length-2;i>=0;i--){if(h[i][campo]!==cur){var prev=h[i][campo];if(!prev)return null;return {prev:prev,cur:cur,pct:(cur-prev)/prev*100,t:h[h.length-1].t}}}
  return null;
}
function trendBadge(t,tipo){
  if(!t)return '';
  var up=t.pct>0,good=tipo==='costo'?!up:up;
  return '<span class="trend '+(good?'good':'bad')+'" title="Antes '+money(t.prev)+'">'+(up?'▲ ':'▼ ')+Math.abs(t.pct).toFixed(1)+'%</span>';
}
function lastPriceT(p){return p.historial.length?p.historial[p.historial.length-1].t:null}
function fmtDate(t){return new Date(t).toLocaleDateString('es-HN',{day:'numeric',month:'short'})}
function fmtDT(t){var d=new Date(t);return d.toLocaleDateString('es-HN',{day:'numeric',month:'short'})+' '+d.toLocaleTimeString('es-HN',{hour:'2-digit',minute:'2-digit'})}
function ventas(){return state.movimientos.filter(function(m){return m.tipo==='venta'})}
function inicial(p){return esc((p.nombre||'?').trim().slice(0,2).toUpperCase())}
function fotoHtml(p){return p.foto?'<img src="'+esc(p.foto)+'" alt="">':inicial(p)}
function totalUnidades(vars){return vars.reduce(function(a,v){return a+(Number(v.unidades)||0)},0)}
function parseVars(txt){
  var out=[];String(txt||'').split('\n').forEach(function(l){var m=l.trim().match(/^(.+?)\s*[=:]\s*(\d+)$/);if(m)out.push({nombre:m[1].trim(),unidades:parseInt(m[2],10)})});return out;
}
function estadoTxt(p){var e=estado(p);return e==='agotado'?'Agotado':e==='bajo'?'Stock bajo':'En stock'}
 
/* ---------- Stock rápido ---------- */
function bumpStock(id,nuevo){
  var p=state.productos.find(function(x){return x.id===id});if(!p||p.variaciones.length)return;
  nuevo=Math.max(0,Math.floor(nuevo));if(!isFinite(nuevo)||nuevo===p.unidades)return;
  var e=pend[id]||(pend[id]={base:p.unidades,val:p.unidades,t:0});
  e.val=nuevo;p.unidades=nuevo;render();
  clearTimeout(e.t);
  e.t=setTimeout(function(){
    delete pend[id];
    var cur=state.productos.find(function(x){return x.id===id});if(!cur||e.val===e.base)return;
    guard(function(){return S.patch('productos',id,{unidades:e.val}).then(function(){return mov({tipo:'ajuste',productoId:id,productoNombre:cur.nombre,cant:e.val-e.base,nota:'De '+e.base+' a '+e.val})})});
  },700);
}

  return '<span class="step"><button class="sbtn" data-act="menos" data-id="'+p.id+'" aria-label="Restar una unidad"'+(p.unidades<=0?' disabled':'')+'>−</button>'+
   '<input class="sin" id="si-'+p.id+'" type="number" min="0" step="1" inputmode="numeric" data-sid="'+p.id+'" value="'+p.unidades+'" aria-label="Unidades de '+esc(p.nombre)+'">'+
   '<button class="sbtn" data-act="mas" data-id="'+p.id+'" aria-label="Sumar una unidad">+</button></span>';
}

function buckets(per){
  var n=new Date(),out=[],i,s,e;
  if(per==='dia'){for(i=13;i>=0;i--){s=new Date(n.getFullYear(),n.getMonth(),n.getDate()-i);e=new Date(n.getFullYear(),n.getMonth(),n.getDate()-i+1);out.push({s:+s,e:+e,label:s.toLocaleDateString('es-HN',{day:'numeric',month:'short'})})}}
  else if(per==='semana'){var dow=(n.getDay()+6)%7;for(i=7;i>=0;i--){s=new Date(n.getFullYear(),n.getMonth(),n.getDate()-dow-7*i);e=new Date(n.getFullYear(),n.getMonth(),n.getDate()-dow-7*i+7);out.push({s:+s,e:+e,label:s.toLocaleDateString('es-HN',{day:'numeric',month:'short'})})}}
  else{for(i=5;i>=0;i--){s=new Date(n.getFullYear(),n.getMonth()-i,1);e=new Date(n.getFullYear(),n.getMonth()-i+1,1);out.push({s:+s,e:+e,label:s.toLocaleDateString('es-HN',{month:'short'})})}}
  return out;
}
function nice(max){if(max<=0)return 100;var e=Math.pow(10,Math.floor(Math.log10(max))),f=max/e,c=[1,2,4,5,8,10],k=0;for(var i=0;i<c.length;i++){if(f<=c[i]){k=c[i];break}}return k*e}
function short(n){return n>=1000?(n/1000).toFixed(n%1000===0?0:1)+'k':String(Math.round(n))}
function drawChart(){
  var el=$('#chart');if(!el)return;
  var vs=ventas(),data=buckets(state.periodo).map(function(b){var sum=0,c=0;vs.forEach(function(m){if(m.t>=b.s&&m.t<b.e){sum+=m.cant*m.precio;c++}});return {label:b.label,sum:sum,c:c}});
  var total=data.reduce(function(a,d){return a+d.sum},0),maxv=Math.max.apply(null,data.map(function(d){return d.sum}));
  var sumEl=$('#chart-sum');if(sumEl)sumEl.textContent=total?'Total del periodo: '+money(total):'';
  if(!maxv){el.innerHTML='<p class="empty-inline">Todavía no hay ventas en este periodo. Registra una con el botón Vender en Inventario.</p>';return}
  var W=Math.max(280,el.clientWidth),H=230,L=44,R=8,T=16,B=28,top=nice(maxv),pw=W-L-R,ph=H-T-B,band=pw/data.length,bw=Math.min(40,band*.62),step=Math.ceil(46/band);
  var s='<svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Ventas por periodo">',i;
  for(i=0;i<=4;i++){var y=T+ph-ph*i/4;s+='<line class="gridl" x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'"/><text class="ax" x="'+(L-6)+'" y="'+(y+4)+'" text-anchor="end">'+short(top*i/4)+'</text>'}
  data.forEach(function(d,k){
    var h=d.sum/top*ph,x=L+band*k+(band-bw)/2,y=T+ph-h,last=k===data.length-1;
    if(d.sum>0)s+='<rect class="bar'+(last?' last':'')+'" x="'+x+'" y="'+y+'" width="'+bw+'" height="'+h+'" rx="2"><title>'+esc(d.label)+': '+money(d.sum)+'</title></rect>';
    if(last&&d.sum>0)s+='<text class="bar-lbl" x="'+(x+bw/2)+'" y="'+(y-5)+'" text-anchor="middle">'+short(d.sum)+'</text>';
    if((data.length-1-k)%step===0)s+='<text class="ax" x="'+(x+bw/2)+'" y="'+(H-9)+'" text-anchor="middle">'+esc(d.label)+'</text>';
  });
  el.innerHTML=s+'</svg>';

function describePrecios(o,n){
  var out=[];[['detalle','Detalle'],['mayorista','Mayorista'],['costo','Costo']].forEach(function(c){if(o[c[0]]!==n[c[0]])out.push(c[1]+' '+money(o[c[0]])+' → '+money(n[c[0]]))});return out.join('; ');
}
function persistProducto(old,np,sinAjuste){
  np.historial=old&&old.historial?clone(old.historial):[];
  var changed=!old||old.detalle!==np.detalle||old.mayorista!==np.mayorista||old.costo!==np.costo;
  if(changed){np.historial.push({t:Date.now(),detalle:np.detalle,mayorista:np.mayorista,costo:np.costo});np.historial=np.historial.slice(-60)}
  var data=clone(np);delete data.id;
  return S.put('productos',np.id,data).then(function(){
    var base={productoId:np.id,productoNombre:np.nombre};
    if(!old)return mov(Object.assign({tipo:'alta',cant:np.unidades},base));
    var p=Promise.resolve();
    if(old.unidades!==np.unidades&&!sinAjuste)p=p.then(function(){return mov(Object.assign({tipo:'ajuste',cant:np.unidades-old.unidades,nota:'De '+old.unidades+' a '+np.unidades},base))});
    if(changed)p=p.then(function(){return mov(Object.assign({tipo:'precio',cant:0,nota:describePrecios(old,np)},base))});
    return p;
  });
}

function exportar(){
  var txt=csvText();
  var finish=function(){openModal('<h2>Copiar inventario</h2><p class="sub" style="margin:0 0 10px">Tu navegador no permite guardar el archivo desde aquí. Copia el texto y pégalo en un archivo con extensión .csv.</p><textarea class="inp" id="csv-out" rows="10" readonly>'+esc(txt)+'</textarea><div class="acts"><button class="btn" data-act="close">Cerrar</button></div>');var t=$('#csv-out');t.focus();t.select()};
  if(!window.claude||!window.claude.use){finish();return}
  window.claude.use('downloads').then(function(d){
    if(!d){finish();return}
    return d.save({filename:'inventario.csv',data:txt}).then(function(){toast('Archivo guardado.')}).catch(function(e){if(!e||e.code!=='declined')finish()});
  }).catch(finish);

function parseCSV(text){
  text=text.replace(/^﻿/,'');
  var first=text.split('\n')[0]||'',delim=(first.split(';').length>first.split(',').length)?';':',';
  var rows=[],row=[],cur='',q=false,i,c;
  for(i=0;i<text.length;i++){c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){cur+='"';i++}else q=false}else cur+=c}
    else if(c==='"')q=true;
    else if(c===delim){row.push(cur);cur=''}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cur);cur='';if(row.some(function(x){return x.trim()}))rows.push(row);row=[]}
    else cur+=c;
  }
  row.push(cur);if(row.some(function(x){return x.trim()}))rows.push(row);
  return rows;
}
function norm(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z]/g,'')}
function planImport(text){
  var rows=parseCSV(text);if(rows.length<2)return {error:'El archivo no tiene filas de productos.'};
  var map={sku:['sku','codigo','codigodebarras','referencia'],nombre:['nombre','producto','articulo','descripcion'],categoria:['categoria'],proveedor:['proveedor'],unidades:['unidades','stock','existencias','cantidad'],minimo:['minimo','stockminimo'],costo:['costo','preciodecosto'],detalle:['detalle','preciodetalle','precio','preciopublico'],mayorista:['mayorista','preciomayorista','pormayor','preciopormayor']};
  var head=rows[0].map(norm),idx={};
  Object.keys(map).forEach(function(k){for(var i=0;i<head.length;i++){if(map[k].indexOf(head[i])>=0){idx[k]=i;break}}});
  if(idx.nombre==null&&idx.sku==null)return {error:'No encontré una columna "nombre" o "sku" en la primera fila.'};
  var plan=[],nuevos=0,cambios=0,sin=0,sinCat=0;
  rows.slice(1).forEach(function(r){
    var g=function(k){return idx[k]==null?undefined:String(r[idx[k]]==null?'':r[idx[k]]).trim()};
    var sku=g('sku'),nombre=g('nombre'),old=null;
    if(sku)old=state.productos.find(function(p){return p.sku&&p.sku.toLowerCase()===sku.toLowerCase()});
    if(!old&&nombre)old=state.productos.find(function(p){return p.nombre.toLowerCase()===nombre.toLowerCase()});
    if(!old&&!nombre){sin++;return}
    var np=old?clone(old):{id:newId('productos'),nombre:nombre,sku:'',categoria:'',proveedorId:'',unidades:0,minimo:null,costo:0,detalle:0,mayorista:0,oferta:null,foto:'',nota:'',variaciones:[],historial:[],creado:Date.now()};
    if(nombre)np.nombre=nombre;if(sku!=null&&sku!=='')np.sku=sku;
    if(g('categoria')){var cat=CATEGORIAS.find(function(c){return norm(c)===norm(g('categoria'))});if(cat)np.categoria=cat;else sinCat++}
    if(g('proveedor')){var pv=state.proveedores.find(function(p){return p.nombre.toLowerCase()===g('proveedor').toLowerCase()});if(pv)np.proveedorId=pv.id}
    if(g('unidades')!=null&&g('unidades')!==''&&!np.variaciones.length)np.unidades=Math.floor(pnum(g('unidades')));
    ['minimo','costo','detalle','mayorista'].forEach(function(k){if(g(k)!=null&&g(k)!==''){np[k]=k==='minimo'?Math.floor(pnum(g(k))):pnum(g(k))}});
    if(old)cambios++;else nuevos++;
    plan.push({old:old,np:np});
  });
  return {plan:plan,nuevos:nuevos,cambios:cambios,sin:sin,sinCat:sinCat};
}
function onImportFile(file){
  var fr=new FileReader();
  fr.onload=function(){
    var r=planImport(String(fr.result||''));
    if(r.error){toast(r.error);return}
    importPlan=r.plan;
    openModal('<h2>Importar productos</h2><p style="margin:0 0 10px">Se agregarán <strong>'+num(r.nuevos)+'</strong> productos nuevos y se actualizarán <strong>'+num(r.cambios)+'</strong> que ya existen (se busca por SKU y luego por nombre).'+(r.sin?' '+num(r.sin)+' filas sin nombre se ignoran.':'')+(r.sinCat?' '+num(r.sinCat)+' filas traen una categoría que no está en tu lista; esas quedan sin categoría hasta que la elijas.':'')+'</p><div class="pv">'+r.plan.slice(0,8).map(function(x){return '<div>'+(x.old?'Actualiza: ':'Nuevo: ')+esc(x.np.nombre)+' · '+num(x.np.unidades)+' u · '+money(x.np.detalle)+'</div>'}).join('')+(r.plan.length>8?'<div>y '+(r.plan.length-8)+' más…</div>':'')+'</div><div class="acts"><button class="btn" data-act="close">Cancelar</button><button class="btn primary" data-act="import-apply"'+(r.plan.length?'':' disabled')+'>Aplicar cambios</button></div>');
  };
  fr.onerror=function(){toast('No se pudo leer el archivo.')};
  fr.readAsText(file,'utf-8');
}
function aplicarImport(){
  var plan=importPlan||[];if(!plan.length)return;
  var btn=$('[data-act="import-apply"]');if(btn){btn.disabled=true;btn.textContent='Aplicando…'}
  guard(function(){return plan.reduce(function(p,x){return p.then(function(){return persistProducto(x.old,x.np)})},Promise.resolve())}).then(function(){closeModal();toast('Importación lista: '+plan.length+' productos.')});
}
 
/* ---------- Fotos ---------- */
function onFoto(file){
  if(!file)return;var url=URL.createObjectURL(file),img=new Image();
  img.onload=function(){
    var max=480,k=Math.min(1,max/Math.max(img.width,img.height)),w=Math.round(img.width*k),h=Math.round(img.height*k),c=document.createElement('canvas');
    c.width=w;c.height=h;var ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);ctx.drawImage(img,0,0,w,h);
    var q=.74,d=c.toDataURL('image/jpeg',q);while(d.length>150000&&q>.35){q-=.1;d=c.toDataURL('image/jpeg',q)}
    URL.revokeObjectURL(url);modalFoto=d;var pv=$('#foto-prev');if(pv)pv.innerHTML='<img src="'+d+'" alt="">';
  };
  img.onerror=function(){URL.revokeObjectURL(url);toast('No se pudo leer esa imagen.')};
  img.src=url;
}
 
/* ---------- Eventos ---------- */
function borrarEjemplos(){
  var tasks=[];
  ['productos','proveedores','movimientos'].forEach(function(c){state[c].forEach(function(x){if(x.ejemplo)tasks.push([c,x.id])})});
  guard(function(){return tasks.reduce(function(p,t){return p.then(function(){return S.del(t[0],t[1])})},Promise.resolve())}).then(function(){toast('Datos de ejemplo borrados.')});
}
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-act]');if(!t)return;
  var a=t.dataset.act,id=t.dataset.id;
  if(a==='scrim'){if(e.target===t)closeModal();return}
  var twice=a==='borrar-producto'||a==='prov-borrar'||a==='borrar-ejemplos';
  if(twice&&!t.dataset.armed){t.dataset.armed='1';t.dataset.label=t.textContent;t.textContent='¿Seguro? Toca otra vez';setTimeout(function(){if(t.isConnected&&t.dataset.armed){delete t.dataset.armed;t.textContent=t.dataset.label}},4000);return}
  switch(a){
    case 'tab':state.tab=t.dataset.tab;render();break;
    case 'periodo':state.periodo=t.dataset.p;render();break;
    case 'cat':state.f.cat=t.dataset.c;render();break;
    case 'vista':state.vista=t.dataset.v;try{localStorage.setItem('libro-vista',state.vista)}catch(x){}render();break;
    case 'mas':case 'menos':var p0=state.productos.find(function(x){return x.id===id});if(p0)bumpStock(id,p0.unidades+(a==='mas'?1:-1));break;
    case 'close':closeModal();break;
    case 'nuevo':openProducto(null);break;
    case 'editar':openProducto(id);break;
    case 'vender':openVenta(id);break;
    case 'entrada':openEntrada(id);break;
    case 'ajustes':openAjustes();break;
    case 'prov-nuevo':openProv(null);break;
    case 'prov-editar':openProv(id);break;
    case 'exportar':exportar();break;
    case 'importar':$('#imp').value='';$('#imp').click();break;
    case 'import-apply':aplicarImport();break;
    case 'foto-quitar':modalFoto='';var pv=$('#foto-prev');if(pv){var nm=($('#f-nombre')||{}).value||'?';pv.textContent=nm.trim().slice(0,2).toUpperCase()}break;
    case 'borrar-ejemplos':borrarEjemplos();break;
    case 'borrar-producto':
      var p=state.productos.find(function(x){return x.id===id});if(!p)break;
      guard(function(){return S.del('productos',id).then(function(){return mov({tipo:'baja',productoId:id,productoNombre:p.nombre,cant:-p.unidades,nota:'Producto eliminado'})})}).then(function(){closeModal();toast('Producto eliminado.')});break;
    case 'prov-borrar':guard(function(){return S.del('proveedores',id)}).then(function(){toast('Proveedor eliminado.')});break;
  }
});
document.addEventListener('submit',function(e){
  e.preventDefault();var f=e.target;
  if(f.id==='frm-prod')submitProducto(f);else if(f.id==='frm-venta')submitVenta(f);else if(f.id==='frm-entrada')submitEntrada(f);else if(f.id==='frm-prov')submitProv(f);else if(f.id==='frm-cfg')submitCfg();
});
document.addEventListener('input',function(e){
  var id=e.target.id;
  if(id==='f-q'){state.f.q=e.target.value;var l=$('#inv-list');if(l)l.innerHTML=listaInv()}
  else if(id==='v-cant'||id==='v-precio')updateVentaTotal();
  else if(id==='f-var'){var v=parseVars(e.target.value),u=$('#f-unid');if(u){u.disabled=v.length>0;if(v.length)u.value=totalUnidades(v)}}
});
document.addEventListener('change',function(e){
  var t=e.target,id=t.id;
  if(t.dataset&&t.dataset.sid){bumpStock(t.dataset.sid,pnum(t.value));return}
  if(id==='f-prov'){state.f.prov=t.value;render()}
  else if(id==='f-bajo'){state.f.bajo=t.checked;render()}
  else if(id==='mf'){state.mf=t.value;render()}
  else if(id==='f-foto')onFoto(t.files&&t.files[0]);
  else if(id==='imp'&&t.files&&t.files[0])onImportFile(t.files[0]);
  else if(t.name==='nivel'){var p=state.productos.find(function(x){return x.id===$('#frm-venta').dataset.id});if(p){$('#v-precio').value=t.value==='mayorista'?p.mayorista:precioDetalle(p);updateVentaTotal()}}
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!$('#modal').hidden)closeModal()});
var rz;window.addEventListener('resize',function(){clearTimeout(rz);rz=setTimeout(function(){if(state.tab==='panel')drawChart()},150)});
 
/* ---------- Inicio ---------- */
(function init(){
  render();
  var go=function(){
    if(db){state.mode='nube';subscribe()}else{state.mode='local';loadLocal()}
  };
  if(!window.claude||!window.claude.use){go();return}
  window.claude.use('db').then(function(d){db=d;return window.claude.use('user')}).then(function(u){
    userNS=u;if(u&&u.me)return u.me().then(function(m){myId=(m&&m.id)||null}).catch(function(){});
  }).catch(function(){db=null}).then(go);
})();
})();
</script>
